<style>
  :root {
    --bg: #000000;
    --panel: #131417;

    --border: #232429;
    --fg: #FFFFFF;

    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.28);
    --scrollbar: #2A2C33;
  }
  .pcrm-root.light {
    --bg: #D4D8E3;
    --panel: #FFFFFF;
    --panel2: #F0F1F5;
    --border: #E3E5EB;
    --fg: #000000;
    --muted: #545964;
    --accent: #0E5DFF;
    --accent-soft: rgba(14,93,255,0.10);
    --accent-shadow: rgba(14,93,255,0.22);
    --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 4px 14px rgba(16,24,40,0.06);
    --scrollbar: #D6D9DF;
  }
  html { font-size: 105%; }
  html, body { background: #000000; margin: 0; padding: 0; transition: background .2s; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; }
  .pcrm-kanban-scroll::-webkit-scrollbar { height: 12px; }
  .pcrm-kanban-scroll::-webkit-scrollbar-track { background: var(--panel2); border-radius: 8px; }
  .pcrm-kanban-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }
  .pcrm-kanban-scroll { scrollbar-color: var(--accent) var(--panel2); scrollbar-width: auto; }
  .pcrm-root { transition: background .2s, color .2s; }
  .pcrm-input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--fg);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none; width: 100%;
    transition: border-color .15s, background .2s;
  }
  .pcrm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pcrm-btn {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s, transform .1s;
    box-shadow: 0 2px 8px var(--accent-shadow);
  }
  .pcrm-btn:hover { opacity: .9; }
  .pcrm-btn:active { transform: scale(.98); }
  .pcrm-btn-ghost {
    background: transparent; color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, color .15s;
  }
  .pcrm-btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .pcrm-tab {
    padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
    transition: background .15s, color .15s;
  }
  .pcrm-tab:hover { color: var(--fg); }
  .pcrm-tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pcrm-row:hover { background: var(--panel2); }
  .pcrm-theme-toggle {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--panel2);
    cursor: pointer; font-size: 13px; transition: border-color .15s;
  }
  .pcrm-theme-toggle:hover { border-color: var(--accent); }
  @keyframes pulseRisk { 0%,100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.35);} 50% { box-shadow: 0 0 0 6px rgba(255,77,77,0);} }
  .risk-pulse { animation: pulseRisk 2s infinite; }
</style>
