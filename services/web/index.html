    --accent-soft: rgba(14,93,255,0.10);
    --accent-shadow: rgba(14,93,255,0.22);

  .pcrm-kanban-scroll::-webkit-scrollbar { height: 12px; }
  .pcrm-kanban-scroll::-webkit-scrollbar-track { background: var(--panel2); border-radius: 8px; }
  .pcrm-kanban-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }
  .pcrm-kanban-scroll { scrollbar-color: var(--accent) var(--panel2); scrollbar-width: auto; }
  .pcrm-root { transition: background .2s, color .2s; }
  .pcrm-input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--fg);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none; width: 100%;
    transition: border-color .15s, background .2s;
  }
  .pcrm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pcrm-btn {
    background: var(--accent); color: white; border: none; border-radius: 8px;

  }

<script>
window.CRM_CONFIG = { API_BASE: "__CRM_API_URL__", LOGIN_URL: "__POOLY_CORE_URL__/login" };

window.CRM_API = (function(){
  function getToken(){ return localStorage.getItem('pcrm_auth_token') || ''; }
  function setToken(t){ localStorage.setItem('pcrm_auth_token', t); }
  function clearToken(){ localStorage.removeItem('pcrm_auth_token'); }

  function apiFetch(path, options){
    options = options || {};
    var headers = Object.assign({'Content-Type':'application/json'}, options.headers || {});
    var token = getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(window.CRM_CONFIG.API_BASE + path, Object.assign({}, options, {headers: headers}))
      .then(function(res){
        if (res.status === 401) { clearToken(); window.location.reload(); throw new Error('unauthorized'); }
        if (!res.ok) throw new Error('API error ' + res.status);
        return res.status === 204 ? null : res.json();
      });
  }

  function fetchProspects(){
    return apiFetch('/prospects').then(function(data){ return data.prospects || []; });
  }
  function syncProspects(list){
    return apiFetch('/prospects/bulk', {method:'POST', body: JSON.stringify({prospects:list})})
      .catch(function(err){ console.error('[pooly-crm] sync failed', err); });
  }
  function deleteProspect(id){
    return apiFetch('/prospects/' + encodeURIComponent(id), {method:'DELETE'})
      .catch(function(err){ console.error('[pooly-crm] delete failed', err); });
  }
  function getMe(){
    return apiFetch('/me');
  }

  return { getToken:getToken, setToken:setToken, clearToken:clearToken, apiFetch:apiFetch,
           fetchProspects:fetchProspects, syncProspects:syncProspects, deleteProspect:deleteProspect,
           getMe:getMe };
})();
</script>

<script>
function CrmAuthGate(){
  const [status, setStatus] = React.useState('checking'); // checking | authed | anon
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  function verify(){
    if (!window.CRM_API.getToken()) { setStatus('anon'); return; }
    window.CRM_API.getMe().then(function(me){
      if (me && me.is_admin) { setStatus('authed'); }
      else { window.CRM_API.clearToken(); setStatus('anon'); }
    }).catch(function(){
      window.CRM_API.clearToken(); setStatus('anon');
    });
  }

  React.useEffect(function(){ verify(); }, []);

  if (status === 'checking') {
    return React.createElement('div', {style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#000', color:'#8A8F98', fontFamily:'ui-sans-serif, system-ui, sans-serif', fontSize:13}}, 'Cargando...');
  }

  if (status === 'authed') {
    return React.createElement(window.PoolyCRMApp, null);
  }

  function handleSubmit(e){
    e.preventDefault();
    setLoading(true); setError('');
    fetch(window.CRM_CONFIG.LOGIN_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email, password: password})
    }).then(function(res){
      if (!res.ok) throw new Error('Credenciales invalidas');
      return res.json();
    }).then(function(data){
      window.CRM_API.setToken(data.access_token);
      return window.CRM_API.getMe();
    }).then(function(me){
      if (!me.is_admin) {
        throw new Error('Tu cuenta no tiene permisos de administrador para el CRM.');
      }
      setStatus('authed');
    }).catch(function(err){
      window.CRM_API.clearToken();
      setError(err.message || 'Error de autenticacion');
    }).finally(function(){ setLoading(false); });
  }

  return React.createElement('div', {style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#000', fontFamily:'ui-sans-serif, system-ui, sans-serif'}},
    React.createElement('form', {onSubmit: handleSubmit, style:{background:'#131417', border:'1px solid #232429', borderRadius:12, padding:32, width:320, display:'flex', flexDirection:'column', gap:12}},
      React.createElement('div', {style:{color:'#fff', fontWeight:700, fontSize:18, marginBottom:8}}, 'Pooly CRM'),
      React.createElement('input', {type:'email', placeholder:'Email', value:email, onChange:e=>setEmail(e.target.value), required:true, style:{background:'#1A1B1F', border:'1px solid #232429', color:'#fff', borderRadius:8, padding:'8px 12px', fontSize:13}}),
      React.createElement('input', {type:'password', placeholder:'Contrasena', value:password, onChange:e=>setPassword(e.target.value), required:true, style:{background:'#1A1B1F', border:'1px solid #232429', color:'#fff', borderRadius:8, padding:'8px 12px', fontSize:13}}),
      error ? React.createElement('div', {style:{color:'#F5C842', fontSize:12}}, error) : null,
      React.createElement('button', {type:'submit', disabled:loading, style:{background:'#0E5DFF', color:'#fff', border:'none', borderRadius:8, padding:'8px 14px', fontSize:13, fontWeight:600, cursor:'pointer'}}, loading ? 'Entrando...' : 'Entrar')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(CrmAuthGate));
</script>
